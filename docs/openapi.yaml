components:
  schemas:
    AssetIn:
      properties:
        type:
          type: string
          title: Type
          description: mermaid / plotly / snapshot / svg / file
        caption:
          type: string
          title: Caption
          default: ''
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
          description: mermaid source, Plotly JSON or SVG markup
        figure:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Figure
          description: Plotly figure object
        data_base64:
          anyOf:
          - type: string
          - type: 'null'
          title: Data Base64
          description: image / svg / file bytes, base64
        filename:
          anyOf:
          - type: string
          - type: 'null'
          title: Filename
      additionalProperties: false
      type: object
      required:
      - type
      title: AssetIn
    AssignRequest:
      properties:
        assignee:
          anyOf:
          - type: string
          - type: 'null'
          title: Assignee
          description: null or empty string clears it
      additionalProperties: false
      type: object
      title: AssignRequest
    BlockersRequest:
      properties:
        blocker_ids:
          items:
            type: string
          type: array
          title: Blocker Ids
      additionalProperties: false
      type: object
      required:
      - blocker_ids
      title: BlockersRequest
    CommentRequest:
      properties:
        text:
          type: string
          title: Text
      additionalProperties: false
      type: object
      required:
      - text
      title: CommentRequest
    ConnectRequest:
      properties:
        alias:
          anyOf:
          - type: string
          - type: 'null'
          title: Alias
          description: server name in .mcp.json
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
          description: 'KANBAN_ACTOR (default: keep existing, else claude)'
      additionalProperties: false
      type: object
      title: ConnectRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LinkIn:
      properties:
        type:
          type: string
          title: Type
          description: one of memory, file, pr, url, plan
        value:
          type: string
          title: Value
      additionalProperties: false
      type: object
      required:
      - type
      - value
      title: LinkIn
    LinkRequest:
      properties:
        type:
          type: string
          title: Type
        value:
          type: string
          title: Value
      additionalProperties: false
      type: object
      required:
      - type
      - value
      title: LinkRequest
    MessageRequest:
      properties:
        text:
          type: string
          title: Text
        kind:
          type: string
          title: Kind
          description: instruction / comment / feedback / answer / stop
          default: instruction
        task_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Task Id
          description: card the message is about (session messages)
        parent_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Parent Id
          description: message this one answers
        report_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Report Id
          description: report the message comments on
        asset_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Asset Id
          description: figure (asset) the message comments on
      additionalProperties: false
      type: object
      required:
      - text
      title: MessageRequest
    MoveRequest:
      properties:
        to_status:
          type: string
          title: To Status
        column_order:
          anyOf:
          - type: integer
          - type: 'null'
          title: Column Order
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
        expected_from:
          anyOf:
          - type: string
          - type: 'null'
          title: Expected From
          description: only move if the task is still in this status (409 otherwise)
      additionalProperties: false
      type: object
      required:
      - to_status
      title: MoveRequest
    PauseRequest:
      properties:
        paused:
          type: boolean
          title: Paused
          default: true
      additionalProperties: false
      type: object
      title: PauseRequest
    ProjectArchiveRequest:
      properties:
        archived:
          type: boolean
          title: Archived
          default: true
      type: object
      title: ProjectArchiveRequest
    ProjectCreate:
      properties:
