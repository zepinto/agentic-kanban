openapi: 3.1.0
info:
  title: Kanban
  version: 0.3.0
paths:
  /:
    get:
      summary: Index
      operationId: index__get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
  /p/{project_id}:
    get:
      summary: Index For Project
      description: 'SPA-style: same HTML, the frontend reads project_id from location.pathname.'
      operationId: index_for_project_p__project_id__get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /t/{task_id}:
    get:
      summary: Index For Task
      description: 'Link to one card: the board of its project with the card open.'
      operationId: index_for_task_t__task_id__get
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      - name: project_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /p/{project_id}/t/{task_id}:
